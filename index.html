<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Logístico Operativo</title>
  <link rel="stylesheet" href="styles.css">
  <!-- SheetJS para lectura de Excel local -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- BARRA LATERAL (Filtro por Canal) -->
    <aside class="sidebar">
      <div class="brand">
        <h2>Logística</h2>
        <span class="subtext">Operaciones Kanban</span>
      </div>
      <div class="channel-filter">
        <h3>Canal de Venta</h3>
        <button class="btn-channel active" data-channel="todos">Todos</button>
        <button class="btn-channel" data-channel="a despachar">A Despachar</button>
        <button class="btn-channel" data-channel="a retirar por cliente">A Retirar Cliente</button>
        <button class="btn-channel" data-channel="ecommerce">Ecommerce</button>
        <button class="btn-channel" data-channel="retail">Retail</button>
        <button class="btn-channel btn-pendiente" data-channel="pendiente">⚠️ Pendientes</button>
      </div>
      
      <!-- Carga Local del Archivo -->
      <div class="file-loader">
        <label for="excel-file" class="btn-upload">📁 Cargar Excel Local</label>
        <input type="file" id="excel-file" accept=".xls,.xlsx,.xlsm" style="display:none;">
        <div id="sync-info" class="sync-info">Sin sincronizar</div>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      
      <!-- CABECERA DE CONTROL -->
      <header class="top-header">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="🔍 Buscar por N° NV, cliente o vendedor...">
        </div>
        <div class="time-window">
          <span>📅 Ventana: <strong>Últimos 7 días hábiles</strong></span>
        </div>
      </header>

      <!-- TABLERO KANBAN -->
      <section class="kanban-board">
        
        <!-- Columna 1: Entregado / Concluido -->
        <div class="kanban-column" id="col-entregado">
          <div class="column-header">
            <div class="col-title">
              <h3>Entregado / Concluido</h3>
              <span class="badge-count" id="count-entregado">0</span>
            </div>
            <div class="kpi-mini">
              <div>Semana: <strong id="kpi-semana">$0</strong></div>
              <div>Día Ant.: <strong id="kpi-dia-anterior">$0</strong></div>
            </div>
          </div>
          <div class="column-cards scrollable-y" id="cards-entregado"></div>
        </div>

        <!-- Columna 2: Programado -->
        <div class="kanban-column" id="col-programado">
          <div class="column-header">
            <div class="col-title">
              <h3>Programado</h3>
              <span class="badge-count" id="count-programado">0</span>
            </div>
          </div>
          <div class="column-cards scrollable-y" id="cards-programado"></div>
        </div>

        <!-- Columna 3: Por Programar -->
        <div class="kanban-column" id="col-por-programar">
          <div class="column-header">
            <div class="col-title">
              <h3>Por Programar</h3>
              <span class="badge-count" id="count-por-programar">0</span>
            </div>
          </div>
          <div class="column-cards scrollable-y" id="cards-por-programar"></div>
        </div>

        <!-- Columna 4: En Despacho / Tránsito -->
        <div class="kanban-column" id="col-despacho">
          <div class="column-header">
            <div class="col-title">
              <h3>En Despacho / Tránsito</h3>
              <span class="badge-count" id="count-despacho">0</span>
            </div>
          </div>
          <div class="column-cards scrollable-y" id="cards-despacho"></div>
        </div>

        <!-- Columna 5: Pendientes -->
        <div class="kanban-column" id="col-pendiente">
          <div class="column-header">
            <div class="col-title">
              <h3>Pendientes</h3>
              <span class="badge-count" id="count-pendiente">0</span>
            </div>
          </div>
          <div class="column-cards scrollable-y" id="cards-pendiente"></div>
        </div>

      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
